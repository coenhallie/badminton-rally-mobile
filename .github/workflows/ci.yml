name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only: nothing here publishes, comments or tags.
permissions:
  contents: read

# A push to a branch supersedes the run for the push before it. The two macOS
# jobs are the expensive ones and were running to completion for every commit.
# Not on main or a tag: those runs are the record of what shipped.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shared-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # ANALYSIS_REQUIRE_CORPUS: the golden tests skip themselves when their
      # fixtures are missing, and a skip reports green. The fixtures are
      # committed, so here a skip is a failure.
      - run: ./gradlew :shared:jvmTest :analysis:jvmTest
        env:
          ANALYSIS_REQUIRE_CORPUS: "1"

  ios-framework:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # iosSimulatorArm64Test runs :shared's commonTest on the iOS target, which
      # nothing here used to do: the job linked the framework and compiled
      # :analysis' iOS tests without running either module's. That left iOS-only
      # failures invisible, and there was one.
      - run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 :shared:iosSimulatorArm64Test :analysis:iosSimulatorArm64Test

  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :androidApp:testDebugUnitTest
      # The instrumented tests need a device and the models, neither of which is
      # here, but they can at least be kept compiling.
      - run: ./gradlew :androidApp:compileDebugAndroidTestKotlin -PonnxModelsOptional=true
      - run: tools/check-container-colors.sh

  android-assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The bundled ONNX graphs are gitignored derived artifacts, and exporting
      # them needs the Modal weights and torch, neither of which is available
      # here. This job proves the app compiles and packages; the APK it produces
      # has no models in it and cannot analyse a video.
      - run: ./gradlew :androidApp:assembleDebug -PonnxModelsOptional=true
      # Lint, and the RELEASE variant, because neither ran anywhere. Lint had
      # eleven errors, two of them crashes on API 26-28, and assembleRelease had
      # stopped completing at all: lintVital is part of it and not of
      # assembleDebug, so every debug build on every machine stayed green.
      - run: ./gradlew :androidApp:lintDebug :androidApp:assembleRelease -PonnxModelsOptional=true

  ios-app:
    # macos-15+: the committed pbxproj uses project format 77, unreadable by
    # macos-14's Xcode 15.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: cp iosApp/Config/Supabase.xcconfig.example iosApp/Config/Supabase.xcconfig
      - name: Run iOS tests on first available iPhone simulator
        # ONNX_MODELS_OPTIONAL: the same escape hatch android-assemble takes
        # with -PonnxModelsOptional=true, and for the same reason - the bundled
        # graphs are gitignored derived artifacts and exporting them needs the
        # Modal weights and torch. The app this builds cannot analyse a video,
        # and the on-device tests skip themselves rather than fail when the
        # graphs are absent.
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9][^(]*' | head -1 | sed 's/ *$//')
          echo "Using simulator: $DEVICE"
          ONNX_MODELS_OPTIONAL=YES xcodebuild test \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO

  version-tag-check:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches Config/Version.xcconfig
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE=$(sed -n 's/^MARKETING_VERSION *= *//p' Config/Version.xcconfig | tr -d '[:space:]')
          if [ "$TAG" != "$FILE" ]; then
            echo "::error::Tag v$TAG does not match MARKETING_VERSION=$FILE in Config/Version.xcconfig"
            exit 1
          fi
          echo "Tag v$TAG matches Version.xcconfig"
