name: iosApp
options:
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config/AppConfig.xcconfig
  Release: Config/AppConfig.xcconfig
packages:
  # The same runtime version androidApp pins in gradle/libs.versions.toml. Two
  # versions would put a second variable into an A/B comparison whose whole
  # point is that only the platform layer differs.
  #
  # SPM rather than the onnxruntime-objc pod: CocoaPods would mean a workspace,
  # and the Compile Kotlin Framework pre-build script below already owns how
  # Shared.framework reaches this target.
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: 1.20.0
targets:
  iosApp:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets, Resources]
    dependencies:
      - package: onnxruntime
        product: onnxruntime
    # Declared, not inherited: the session lives in the Keychain (see
    # resolveSessionStore). Without this entitlement every Keychain call returns
    # -34018 and the app silently falls back to plaintext NSUserDefaults.
    entitlements:
      path: iosApp.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.badmintontracker.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.badmintontracker.ios
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework Shared"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Shuttl
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        UILaunchScreen: {}
        UIAppFonts:
          - Archivo-Regular.ttf
          - Archivo-Medium.ttf
          - Archivo-SemiBold.ttf
          - Archivo-Bold.ttf
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Shuttl uses the camera to record match videos.
        NSMicrophoneUsageDescription: Shuttl records audio with your match videos.
        NSPhotoLibraryAddUsageDescription: Shuttl saves your recordings to the Photos library.
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ -z "${JAVA_HOME:-}" ]; then export JAVA_HOME=$(/usr/libexec/java_home); fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    postBuildScripts:
      # After the build, not before: it writes into BUILT_PRODUCTS_DIR, which a
      # pre-build phase would see emptied again by the resource copy that
      # follows it. See the script for why the graphs are staged rather than
      # committed.
      - name: Stage ONNX Models
        basedOnDependencyAnalysis: false
        script: '"$SRCROOT/Scripts/stage-onnx-models.sh"'
    scheme:
      testTargets: [iosAppTests, iosAppUITests]
  iosAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: iosApp
  # Hit testing is not reachable from a unit test: the swatch-grid bug that
  # motivated this target was a SwiftUI List routing one tap to every button in
  # the cell, which only a real touch through the accessibility API reproduces.
  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: iosApp
